[project]
name = "infer-cam-calibrator"
version = "0.1.0"
description = "Camera calibration service that runs next to kiosk_fw"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coloredlogs==15.0.1",
    "contourpy==1.3.2",
    "cycler==0.12.1",
    "flatbuffers==25.2.10",
    "fonttools==4.58.1",
    "humanfriendly==10.0",
    "kiwisolver==1.4.8",
    "matplotlib==3.10.3",
    "mpmath==1.3.0",
    "numpy==2.2.6",
    "onnxruntime==1.22.0",
    "opencv-python==4.11.0.86",
    "packaging==25.0",
    "paho-mqtt==2.1.0",
    "pillow==11.2.1",
    "protobuf==6.31.1",
    "pyparsing==3.2.3",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "sympy==1.14.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "infer_cam_calibrator"

[tool.uv]
# uv is pinned. bin/install.sh bootstraps this exact release, verified by checksum:
#   https://github.com/astral-sh/uv/releases/download/0.12.18/uv-x86_64-unknown-linux-gnu.tar.gz
#   sha256 89eadd7c76fc063887959510d5ba0ab1264dfd5f1143b925ddb73021a40acf16
required-version = "==0.12.18"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Temporary: the service modules are still flat at the repo root.
# Remove once they live in src/infer_cam_calibrator/.
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
train = [
    "ultralytics>=8.4.123",
]
